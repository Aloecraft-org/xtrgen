[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xtrgen"
version = "0.1.0"
description = "Fill {{placeholder}} tokens in a template from a JSON or YAML config."
readme = "README.md"
authors = [
    {name = "Michael Godfrey", email = "michael@aloecraft.org"}
]
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
keywords = ["cli", "tui", "llm", "ai", "copilot", "patch"]
dependencies = [
    "windows-curses; sys_platform == 'win32'"
]

[project.urls]
Homepage = "https://github.com/Aloecraft-org/xtrgen"
Repository = "https://github.com/Aloecraft-org/xtrgen"

[project.scripts]
xtrgen = "xtrgen:main"

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.pytest.ini_options]
  pythonpath = ["."]
  testpaths = ["test"]

[tool.setuptools.packages.find]
where = ["."]
include = ["xtrgen*"]

[tool.setuptools.package-data]
xtrgen = ["assets/*.md"]